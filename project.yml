name: CloudSim
options:
  bundleIdPrefix: com.dcantu96
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  CloudSim:
    type: application
    platform: iOS
    sources: [App]
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Capsule
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          # The API runs on the same machine as the Simulator over plain HTTP.
          NSAllowsLocalNetworking: true
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.dcantu96.CloudSim
        TARGETED_DEVICE_FAMILY: "1"
  CloudSimUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: CloudSim
    settings:
      base:
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.dcantu96.CloudSimUITests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: CloudSim
  # Not part of the e2e gate: a human-paced walkthrough that CI records as a PR's demo video.
  CloudSimDemo:
    type: bundle.ui-testing
    platform: iOS
    sources: [DemoTests]
    dependencies:
      - target: CloudSim
    settings:
      base:
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.dcantu96.CloudSimDemo
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: CloudSim
schemes:
  # The e2e suite: the merge gate.
  CloudSim:
    build:
      targets:
        CloudSim: all
        CloudSimUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [CloudSimUITests]
  # The demo recording only.
  CloudSimDemo:
    build:
      targets:
        CloudSim: all
        CloudSimDemo: [test]
    test:
      config: Debug
      targets: [CloudSimDemo]
