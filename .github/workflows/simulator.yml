name: Run in iOS Simulator

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: simulator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  simulator:
    # Xcode 27 / macOS 27 image (Apple Silicon). Newest Apple toolchain GitHub hosts.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build, boot, launch, capture
        run: bash scripts/run-in-simulator.sh

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: simulator-output
          path: out/
          if-no-files-found: warn

      - name: Publish results to the simulator-output branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/publish-output.sh
