name: E2E in iOS Simulator

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "demo/**"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md", "demo/**"]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  e2e:
    # Xcode 27 / macOS 27 image (Apple Silicon). Newest Apple toolchain GitHub hosts.
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Start Postgres + API (and run API tests)
        run: bash scripts/start-backend.sh

      - name: Run XCUITest e2e in the Simulator
        run: bash scripts/run-e2e.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-output
          path: out/
          if-no-files-found: warn

      - name: Publish results to the simulator-output branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/publish-output.sh
