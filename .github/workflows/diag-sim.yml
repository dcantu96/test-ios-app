name: Diag Simulator boot

# Temporary: does stopping iOS's first-run background services calm the Simulator, and does e2e still pass?
on:
  push:
    branches: ["diag/**"]

jobs:
  boot:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm, cache-dependency-path: api/package-lock.json }
      - name: Measure
        run: |
          set +e
          sudo mdutil -a -i off > /dev/null 2>&1
          stamp() { echo "$(( $(date +%s) - T0 ))s  $1"; }
          watch() { for i in $(seq 1 $1); do printf "+%ss load %s\n" "$(( $(date +%s) - T0 ))" "$(sysctl -n vm.loadavg | awk '{print $2}')"; sleep 10; done; }
          TJ=$(date +%s)
          NO_BOOT=1 OUT=$PWD/out bash scripts/sim.sh prepare >/dev/null; source out/sim.env; export SIM_UDID
          curl -fsSL -o /tmp/xg.zip https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip && unzip -q -o /tmp/xg.zip -d /tmp && export PATH=/tmp/xcodegen/bin:$PATH
          T0=$(date +%s); bash scripts/start-backend.sh > /tmp/backend.log 2>&1; stamp "backend (no Simulator running)"
          T0=$(date +%s); bash scripts/build.sh >/dev/null; stamp "build (no Simulator running)"
          T0=$(date +%s); xcrun simctl bootstatus "$SIM_UDID" -b >/dev/null; stamp "bootstatus returned"
          echo "=== services before:"; xcrun simctl spawn "$SIM_UDID" launchctl list | tail -n +2 | awk '{print $3}' | sort | tr '\n' ' ' | cut -c1-6000; echo
          bash scripts/sim-quiet.sh "$SIM_UDID"; stamp "quieted (one shell)"
          watch 6
          D=~/Library/Developer/CoreSimulator/Devices/$SIM_UDID/data
          echo "=== where launchd keeps 'disabled':"; grep -rla "amsengagementd" "$D/private/var/db" "$D/Library" 2>/dev/null | head -5
          for f in $(grep -rla "amsengagementd" "$D/private/var/db" 2>/dev/null | head -2); do echo "--- $f"; plutil -p "$f" 2>/dev/null | head -8; done
          xcrun simctl shutdown "$SIM_UDID"; sleep 3
          echo "=== reboot with those services disabled from the start"
          T0=$(date +%s); xcrun simctl bootstatus "$SIM_UDID" -b >/dev/null; stamp "bootstatus returned"
          watch 6
          T0=$(date +%s); bash scripts/run-e2e.sh > /tmp/e2e.log 2>&1; stamp "e2e exit $?"
          grep -E "Test Case.*(passed|failed)" /tmp/e2e.log | head -2
          grep -E "Running tests|All tests' started" out/xcodebuild-test.log | head -2
          echo "TOTAL job-work: $(( $(date +%s) - TJ ))s"
