name: Diag Simulator boot

# Temporary experiment: freeze the Simulator's per-boot background work while e2e runs (cold machine, no cache).
on:
  push:
    branches: ["diag/**"]

jobs:
  freeze:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/mac-setup
        with: { scheme: CloudSim }
      - name: Boot + freeze + e2e
        run: |
          set +e
          stamp() { echo "$(( $(date +%s) - T0 ))s  $1"; }
          T0=$(date +%s); SIM_PREWARM_AX=1 bash scripts/sim.sh boot "$SIM_UDID"; stamp "boot"
          bash scripts/sim-freeze.sh start
          ( for i in $(seq 1 20); do echo "  load $(sysctl -n vm.loadavg | awk '{print $2}') | $(ps -Ao pcpu=,comm= -r | head -4 | sed -E 's|^ *([0-9.]+) .*/([^/]+)$|\1 \2|' | tr '\n' ';')"; sleep 6; done ) &
          T0=$(date +%s); bash scripts/run-e2e.sh > /tmp/e2e.log 2>&1; stamp "e2e exit $?"
          kill %1 2>/dev/null; wait 2>/dev/null
          bash scripts/sim-freeze.sh stop
          grep -E "Test Case.*(passed|failed)" /tmp/e2e.log
          grep -E "Running tests|All tests' started" out/xcodebuild-test.log | head -2
          grep -E "^\s+t = +[0-9.]+s (Open|Waiting 20|Tap \"1y\"|Terminate)" out/xcodebuild-test.log | head -6
          grep -E "error:" out/xcodebuild-test.log | head -3
