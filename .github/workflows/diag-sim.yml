name: Diag Simulator boot

# Temporary experiment: does a cached, fully settled Simulator make a cold PR job fast?
on:
  push:
    branches: ["diag/**"]

jobs:
  make-image:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/mac-setup
        with: { scheme: CloudSim }
      - name: Boot, quiet, settle, warm up, cache
        run: |
          set +e
          stamp() { echo "$(( $(date +%s) - T0 ))s  $1"; }
          T0=$(date +%s); xcrun simctl bootstatus "$SIM_UDID" -b >/dev/null; stamp "first boot"
          bash scripts/sim-quiet.sh "$SIM_UDID"; stamp "quieted"
          for i in $(seq 1 40); do L=$(sysctl -n vm.loadavg | awk '{print $2}'); [ "${L%.*}" -lt 15 ] && break; sleep 10; done; stamp "settled (load $L)"
          bash scripts/run-e2e.sh > /tmp/e2e.log 2>&1; stamp "warm-up e2e exit $?"
          xcrun simctl shutdown all; sleep 3
          du -sh ~/Library/Developer/CoreSimulator/Devices
      - uses: actions/cache/save@v4
        with:
          path: ~/Library/Developer/CoreSimulator/Devices
          key: sim-settled-${{ github.run_id }}

  use-image:
    needs: make-image
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Restore settled Simulator
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Developer/CoreSimulator/Devices
          key: sim-settled-${{ github.run_id }}
      - name: Restart CoreSimulator
        run: sudo killall -9 com.apple.CoreSimulator.CoreSimulatorService 2>/dev/null; xcrun simctl list devices | grep -c Shutdown
      - uses: ./.github/actions/mac-setup
        with: { scheme: CloudSim }
      - name: Boot + e2e on the settled Simulator
        run: |
          set +e
          stamp() { echo "$(( $(date +%s) - T0 ))s  $1"; }
          T0=$(date +%s); xcrun simctl bootstatus "$SIM_UDID" -b >/dev/null; stamp "boot (settled)"
          for i in 1 2 3 4 5 6; do echo "load $(sysctl -n vm.loadavg | awk '{print $2}')"; sleep 5; done
          T0=$(date +%s); bash scripts/run-e2e.sh > /tmp/e2e.log 2>&1; stamp "e2e exit $?"
          grep -E "Test Case.*(passed|failed)" /tmp/e2e.log
          grep -E "Running tests|All tests' started" out/xcodebuild-test.log | head -2
          grep -E "^\s+t = +[0-9.]+s (Open|Waiting 20)" out/xcodebuild-test.log | head -3
