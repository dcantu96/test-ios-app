name: Diag Simulator boot

# Temporary experiment: does a cached, fully settled Simulator make a cold PR job fast?
on:
  push:
    branches: ["diag/**"]

jobs:
  use-image:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Restore settled Simulator
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Developer/CoreSimulator/Devices
          key: sim-settled-42991014726
      - name: Restart CoreSimulator
        run: (sudo killall -9 com.apple.CoreSimulator.CoreSimulatorService 2>/dev/null || true); xcrun simctl list devices | grep -c Shutdown || true
      - uses: ./.github/actions/mac-setup
        with: { scheme: CloudSim }
      - name: Boot + e2e on the settled Simulator
        run: |
          set +e
          stamp() { echo "$(( $(date +%s) - T0 ))s  $1"; }
          T0=$(date +%s); SIM_PREWARM_AX=1 bash scripts/sim.sh boot "$SIM_UDID"; stamp "boot (settled, accessibility on)"
          for i in 1 2 3 4 5 6 7 8; do echo "load $(sysctl -n vm.loadavg | awk '{print $2}') | $(ps -Ao pcpu,comm -r | sed -n '2,5p' | awk '{n=split($2,a,"/"); printf "%s %s; ", $1, a[n]}')"; sleep 8; done
          T0=$(date +%s); bash scripts/run-e2e.sh > /tmp/e2e.log 2>&1; stamp "e2e exit $?"
          grep -E "Test Case.*(passed|failed)" /tmp/e2e.log
          grep -E "Running tests|All tests' started" out/xcodebuild-test.log | head -2
          grep -E "^\s+t = +[0-9.]+s (Open|Waiting 20)" out/xcodebuild-test.log | head -3
