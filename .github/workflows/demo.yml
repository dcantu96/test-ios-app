name: Demo video

# A throwaway preview, not a gate. When a PR opens (or gets the "demo" label, or someone runs this by hand),
# a Mac records DemoTests/DemoWalkthrough driving the app at human pace against the live API, then a Linux
# runner composes the recording into a 1080p60 MP4 and posts it on the PR. The preview lives on the
# demo-preview/<branch> branch and is deleted when the PR closes (cleanup.yml).
on:
  pull_request:
    types: [opened, reopened, ready_for_review, labeled]
  workflow_dispatch:

concurrency:
  group: demo-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  record:
    if: github.event_name != 'pull_request' || github.event.action != 'labeled' || github.event.label.name == 'demo'
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Start Postgres + API
        run: bash scripts/start-backend.sh

      - name: Record the walkthrough in the Simulator
        run: bash scripts/run-demo.sh

      - name: Hand the recording to the compose job
        uses: actions/upload-artifact@v5
        with:
          name: demo-raw
          path: |
            out-demo/raw.mp4
            out-demo/markers.json
            out-demo/device.txt
            out-demo/runtime.txt
            out-demo/xcode-version.txt
          retention-days: 1

  compose:
    needs: record
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BRANCH: ${{ github.head_ref || github.ref_name }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: demo-raw
          path: out-demo

      - name: Install ffmpeg and Pillow
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          python3 -m pip install --quiet pillow

      - name: Compose the MP4
        run: |
          DEVICE="$(sed -E 's/ \([0-9A-F-]{36}\)//; s/ \((Booted|Shutdown)\)//; s/^ +//; s/ +$//' out-demo/device.txt)"
          RUNTIME="$(sed -E 's/ \(.*//' out-demo/runtime.txt)"
          XCODE="$(head -1 out-demo/xcode-version.txt)"
          FOOTER="${PR:+PR #$PR · }$BRANCH · ${HEAD_SHA::7} · $DEVICE, $RUNTIME · $XCODE"
          python3 demo/compose.py --recording out-demo/raw.mp4 --markers out-demo/markers.json \
            --out demo.mp4 --footer "$FOOTER" --quality high

      - name: Keep a copy on the run
        uses: actions/upload-artifact@v5
        with:
          name: demo-video
          path: demo.mp4
          retention-days: 14

      - name: Publish the preview branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          WORK="$(mktemp -d)"
          cp demo.mp4 "$WORK/"
          printf '# Demo preview\n\nFrom `%s` at `%s`. Thrown away when the PR closes.\n\n[demo.mp4](demo.mp4)\n' "$BRANCH" "${HEAD_SHA::7}" > "$WORK/README.md"
          cd "$WORK"
          git init -q -b preview
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Demo preview for ${HEAD_SHA::7}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "preview:refs/heads/demo-preview/$BRANCH"

      - name: Post it on the PR
        if: env.PR != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/raw/demo-preview/${BRANCH}/demo.mp4"
          SIZE="$(du -h demo.mp4 | cut -f1)"
          cat > body.md <<EOF
          ### Demo preview
          **[Watch demo.mp4](${URL})** (1080p60, ${SIZE}), recorded from \`${HEAD_SHA::7}\` in the iOS Simulator on a cloud Mac, driving the app against the live API and Postgres.

          This is a preview, not a test: the e2e check is what gates the merge. Add the \`demo\` label to record it again. The video is deleted when this PR closes.
          EOF
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file body.md --edit-last --create-if-none \
            || gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file body.md
