name: E2E

# The merge gate. Every PR into main runs the full end-to-end suite (API tests against Postgres, then the
# XCUITest suite driving the app in the newest iOS Simulator against the live API). Make the "e2e" check
# required on main so nothing merges without it. No video here: demos are demo.yml's job.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore: ["**.md", "demo/**", "DemoTests/**"]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  e2e:
    name: e2e
    # Xcode 27 / macOS 27 image (Apple Silicon). Newest Apple toolchain GitHub hosts.
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PUBLISH_BRANCH: e2e-output/${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Start Postgres + API (and run API tests)
        run: bash scripts/start-backend.sh

      - name: Run XCUITest e2e in the Simulator
        run: bash scripts/run-e2e.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-output
          path: out/
          retention-days: 7
          if-no-files-found: warn

      - name: Publish screenshots to the e2e-output branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/publish-output.sh
