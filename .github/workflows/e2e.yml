name: CI

# Two Mac machines in parallel, plus a Linux one:
#   e2e         the merge gate: API tests against Postgres, then UITests/ driving the app in the newest iOS
#               Simulator against the live API. Make the "e2e" check required on main.
#   demo        (PRs) the human-paced walkthrough in DemoTests/, recorded. Never blocks the merge.
#   demo-video  composes the recording into a 1080p60 MP4 on Linux and posts it on the PR.
# Each Mac boots one Simulator in the background while it installs, starts the backend and builds
# (.github/actions/mac-setup); a booted, migrated Simulator is cached per runner image.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore: ["**.md", "demo/**", "DemoTests/**"]
  workflow_dispatch:
    inputs:
      demo:
        description: Also record the demo video
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BRANCH: ${{ github.head_ref || github.ref_name }}

jobs:
  e2e:
    name: e2e
    # Xcode 27 / macOS 27 image (Apple Silicon, 5 CPUs). Newest Apple toolchain GitHub hosts.
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      PUBLISH_BRANCH: e2e-output/${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - id: setup
        uses: ./.github/actions/mac-setup
        with:
          scheme: CloudSim

      - name: E2E suite
        run: |
          bash scripts/sim.sh wait "$SIM_UDID"
          bash scripts/run-e2e.sh

      - name: Publish screenshots to the e2e-output branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/publish-output.sh

      - name: Upload e2e results
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-output
          path: out/
          retention-days: 7

      - name: Shut down the Simulator for caching
        if: always() && steps.setup.outputs.sim-cache-hit != 'true'
        run: |
          xcrun simctl shutdown all || true
          du -sh ~/Library/Developer/CoreSimulator/Devices

      - name: Cache the booted Simulator devices
        if: always() && steps.setup.outputs.sim-cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Developer/CoreSimulator/Devices
          key: ${{ steps.setup.outputs.sim-cache-key }}

  demo:
    if: github.event_name == 'pull_request' || inputs.demo
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/mac-setup
        with:
          scheme: CloudSimDemo

      - name: Record the walkthrough
        run: |
          bash scripts/sim.sh wait "$SIM_UDID"
          OUT="$PWD/out-demo" bash scripts/run-demo.sh

      - name: Hand the recording to the compose job
        uses: actions/upload-artifact@v5
        with:
          name: demo-raw
          path: |
            out-demo/raw.mp4
            out-demo/markers.json
            out/device.txt
            out/runtime.txt
            out/xcode-version.txt
          retention-days: 1

  demo-video:
    needs: demo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: demo-raw
          path: raw

      - name: Install ffmpeg (static, via pip) and Pillow
        run: python3 -m pip install --quiet imageio-ffmpeg pillow

      - name: Compose the MP4
        run: |
          export FFMPEG="$(python3 -c 'import os, imageio_ffmpeg; os.environ.pop("IMAGEIO_FFMPEG_EXE", None); print(imageio_ffmpeg.get_ffmpeg_exe())')"
          DEVICE="$(sed -E 's/ \([0-9A-F-]{36}\)//; s/ \((Booted|Shutdown)\)//; s/^ +//; s/ +$//' raw/out/device.txt)"
          RUNTIME="$(sed -E 's/ \(.*//' raw/out/runtime.txt)"
          XCODE="$(head -1 raw/out/xcode-version.txt)"
          FOOTER="${PR:+PR #$PR · }$BRANCH · ${HEAD_SHA::7} · $DEVICE, $RUNTIME · $XCODE"
          python3 demo/compose.py --recording raw/out-demo/raw.mp4 --markers raw/out-demo/markers.json \
            --out demo.mp4 --footer "$FOOTER" --quality high

      - name: Publish the preview branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          WORK="$(mktemp -d)"
          cp demo.mp4 "$WORK/"
          printf '# Demo preview\n\nFrom `%s` at `%s`. Thrown away when the PR closes.\n\n[demo.mp4](demo.mp4)\n' "$BRANCH" "${HEAD_SHA::7}" > "$WORK/README.md"
          cd "$WORK"
          git init -q -b preview
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Demo preview for ${HEAD_SHA::7}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "preview:refs/heads/demo-preview/$BRANCH"

      - name: Post it on the PR
        if: env.PR != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/raw/demo-preview/${BRANCH}/demo.mp4"
          SIZE="$(du -h demo.mp4 | cut -f1)"
          cat > body.md <<EOF
          ### Demo preview
          **[Watch demo.mp4](${URL})** (1080p60, ${SIZE}), recorded from \`${HEAD_SHA::7}\` in the iOS Simulator on a cloud Mac, driving the app against the live API and Postgres.

          This is a preview, not a test: the e2e check is what gates the merge. It's re-recorded on every push and deleted when this PR closes.
          EOF
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file body.md --edit-last --create-if-none \
            || gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file body.md
